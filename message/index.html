<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages | WHISPR</title>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="message.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="header">
  <button class="nav-btn" id="backBtn" type="button">← Back</button>
  <a class="brand" href="enter/index.html" aria-label="WHISPR home"><img src="https://i.imgur.com/7vlpCCX.png" alt="WHISPR logo"><span>WHISPR</span></a>
  <div class="header-actions"><button class="nav-btn" id="groupBtn" type="button">＋ Group</button><a class="nav-btn" href="search/index.html">＋ Find</a></div>
</header>
<main class="main-content">
  <label class="search-label" for="searchInput">Find people or conversations</label>
  <input type="search" id="searchInput" placeholder="Username, email, or conversation..." autocomplete="off">
  <p id="statusMessage" class="status-message" role="status"></p>
  <p class="hold-hint">Tip: hold a conversation, or right-click it, to reveal its remove option. Keyboard: Shift + Delete.</p>
  <section class="people-section" id="peopleSection" hidden aria-label="People matching your search">
    <h2 class="section-heading">People</h2>
    <div class="results" id="peopleResults" aria-live="polite"></div>
  </section>
  <section class="conversation-section" aria-label="Your conversations">
    <h2 class="section-heading" id="conversationHeading">Conversations</h2>
    <section class="results" id="results" aria-live="polite"><div class="empty-state">Loading conversations…</div></section>
  </section>
</main>
<div class="modal-backdrop" id="groupModal" hidden>
  <form class="group-modal" id="groupForm">
    <button class="modal-close" id="closeGroupBtn" type="button" aria-label="Close">×</button>
    <h2>Create a group</h2>
    <p>Start a group with people you know on WHISPR.</p>
    <label for="groupName">Group name</label>
    <input id="groupName" maxlength="40" required placeholder="A name for your group">
    <label for="groupMembers">Members’ usernames</label>
    <input id="groupMembers" required placeholder="e.g. alex, sam (without @)">
    <small>Separate usernames with commas. You’ll be added automatically.</small>
    <button class="primary-btn" id="createGroupBtn" type="submit">Create group</button>
    <p class="form-status" id="groupStatus" role="status"></p>
  </form>
</div>
<script type="module" src="message.js"></script>
<script src="theme.js" defer></script>
</body>
</html>
