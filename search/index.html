<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search | WHISPR</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--page:#101311;--surface:#171b18;--raised:#1d221f;--text:#f1f3ef;--muted:#a2aaa2;--line:#2b332d;--accent:#a8b8a2;--danger:#d48d83}
body{min-height:100vh;margin:0;background:var(--page);color:var(--text);font-family:'Quicksand',sans-serif}
.header{position:sticky;top:0;z-index:5;min-height:72px;padding:12px clamp(16px,4vw,40px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:rgba(16,19,17,.92);backdrop-filter:blur(16px)}
.header h1{margin:0;font-size:1.05rem;letter-spacing:.04em}
.backBtn,.searchBox button{border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);padding:10px 15px;cursor:pointer;font:600 .9rem 'Quicksand',sans-serif}
.backBtn{justify-self:start}.backBtn:hover{border-color:var(--accent)}
main{width:min(760px,100%);margin:0 auto;padding:34px 22px 70px}
.search-label{display:block;margin:0 0 10px 3px;color:var(--muted);font-size:.85rem;font-weight:600}
.searchBox{display:flex;gap:10px}
input{min-width:0;flex:1;padding:14px 17px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--text);outline:none;font:500 .95rem 'Quicksand',sans-serif}
input:focus{border-color:#758773;box-shadow:0 0 0 3px rgba(168,184,162,.12)}
input::placeholder{color:#778078}.searchBox button{background:var(--accent);border-color:var(--accent);color:#182019}.searchBox button:hover{filter:brightness(1.08)}
.section-title{margin:24px 2px 10px;color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.user-list{display:grid;gap:9px}.userItem{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:inherit;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
.userItem:hover,.userItem:focus-visible{background:var(--raised);border-color:#596858;transform:translateY(-1px);outline:none}
.avatar{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;overflow:hidden;border-radius:50%;background:#303a32;color:#d4ded0;font-size:1rem;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}.userInfo{min-width:0}.username{font-weight:700}.handle{margin-top:3px;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.emptyState{text-align:center;padding:28px 18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:.9rem;line-height:1.6}
#msg{min-height:1.2em;margin:12px 2px 0;color:var(--danger);font-size:.85rem}
html[data-theme="light"]{--page:#f4f5f2;--surface:#fff;--raised:#f5f7f3;--text:#242925;--muted:#6b746c;--line:#e1e6e0;--accent:#73866f;--danger:#a9564b}
html[data-theme="light"] .header{background:rgba(249,250,247,.92)}
html[data-theme="light"] .searchBox button{color:#fff}
@media(max-width:520px){.header{min-height:64px;padding:10px 12px;gap:8px}.header h1{font-size:.95rem}.backBtn{padding:8px 10px;font-size:.82rem}main{padding:24px 14px 60px}.searchBox{gap:7px}.searchBox button{padding:10px 13px}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="header">
  <button class="backBtn" type="button" onclick="window.whisprBack('enter/index.html')">← Back</button>
  <h1>WHISPR · Search</h1>
  <span aria-hidden="true"></span>
</header>
<main>
  <form class="searchBox" id="searchForm" role="search">
    <input type="search" id="searchInput" placeholder="Search by username or email" autocomplete="off" aria-label="Search by username or email">
    <button type="submit" id="searchBtn">Search</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <section id="suggestionSection" hidden>
    <h2 class="section-title">People suggestions</h2>
    <div class="user-list" id="suggestions" role="listbox" aria-label="Suggested people"></div>
  </section>
  <section id="resultsSection" hidden>
    <h2 class="section-title">Search results</h2>
    <div class="user-list" id="results" aria-live="polite"></div>
  </section>
  <div class="emptyState" id="emptyState">Type a username or email to find people.</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { searchUsers, userDisplayName, userAvatar } from "./user-search.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsaVQYD00Srv608Zh5pgznckaoyjOJFd0",
  authDomain: "whispr-92fc0.firebaseapp.com",
  projectId: "whispr-92fc0",
  storageBucket: "whispr-92fc0.firebasestorage.app",
  messagingSenderId: "133594748424",
  appId: "1:133594748424:web:7dc7ff44e105d2d5cee3bd"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const input = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const suggestions = document.getElementById("suggestions");
const results = document.getElementById("results");
const suggestionSection = document.getElementById("suggestionSection");
const resultsSection = document.getElementById("resultsSection");
const emptyState = document.getElementById("emptyState");
const message = document.getElementById("msg");
let currentUser = null;
let suggestionTimer;
let suggestionRequest = 0;

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = "login/index.html"; return; }
  currentUser = user;
});

function makeUserItem(user) {
  const item = document.createElement("a");
  item.className = "userItem";
  item.href = `chat/index.html?uid=${encodeURIComponent(user.uid)}&name=${encodeURIComponent(userDisplayName(user))}`;
  const avatar = document.createElement("span");
  avatar.className = "avatar";
  avatar.textContent = userDisplayName(user).charAt(0).toUpperCase();
  const avatarUrl = userAvatar(user);
  if (avatarUrl) {
    const image = document.createElement("img");
    image.src = avatarUrl;
    image.alt = "";
    image.onerror = () => image.remove();
    avatar.appendChild(image);
  }
  const info = document.createElement("span");
  info.className = "userInfo";
  const name = document.createElement("span");
  name.className = "username";
  name.textContent = userDisplayName(user);
  const handle = document.createElement("span");
  handle.className = "handle";
  handle.textContent = user.username ? `@${user.username}` : "Start a conversation";
  info.append(name, document.createElement("br"), handle);
  item.append(avatar, info);
  return item;
}
async function findUsers(term) {
  if (!currentUser) {
    message.textContent = "Please wait while your account loads.";
    return [];
  }
  return searchUsers(db, term, currentUser.uid);
}

input.addEventListener("input", () => {
  clearTimeout(suggestionTimer);
  const term = input.value.trim();
  suggestionRequest++;
  const requestId = suggestionRequest;
  if (!term) {
    suggestionSection.hidden = true;
    resultsSection.hidden = true;
    emptyState.hidden = false;
    emptyState.textContent = "Type a username or email to find people.";
    message.textContent = "";
    return;
  }
  emptyState.hidden = true;
  resultsSection.hidden = true;
  suggestionSection.hidden = false;
  suggestions.replaceChildren(Object.assign(document.createElement("div"), { className: "emptyState", textContent: "Finding people…" }));
  suggestionTimer = setTimeout(async () => {
    try {
      const users = await findUsers(term);
      if (requestId !== suggestionRequest) return;
      suggestions.replaceChildren();
      users.forEach(user => suggestions.appendChild(makeUserItem(user)));
      if (!users.length) suggestions.innerHTML = '<div class="emptyState">No matching people found.</div>';
    } catch (error) {
      if (requestId !== suggestionRequest) return;
      console.error("User suggestions failed", error);
      suggestions.innerHTML = '<div class="emptyState">Suggestions are unavailable right now.</div>';
    }
  }, 250);
});

document.getElementById("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  const term = input.value.trim();
  if (!term) {
    message.textContent = "Enter a username or email to search.";
    return;
  }
  searchBtn.disabled = true;
  suggestionSection.hidden = true;
  message.textContent = "Searching…";
  resultsSection.hidden = false;
  results.replaceChildren(Object.assign(document.createElement("div"), { className: "emptyState", textContent: "Searching…" }));
  try {
    const users = await findUsers(term);
    results.replaceChildren();
    users.forEach(user => results.appendChild(makeUserItem(user)));
    if (!users.length) results.innerHTML = '<div class="emptyState">No matching people found.</div>';
    message.textContent = "";
  } catch (error) {
    console.error("User search failed", error);
    message.textContent = "Could not search right now. Please try again.";
    results.innerHTML = '<div class="emptyState">Search is unavailable right now.</div>';
  } finally {
    searchBtn.disabled = false;
  }
});
</script>
<script src="theme.js" defer></script>
</body>
</html>
