<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat | WHISPR</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="header">
  <a class="back-btn" href="message.html">← <span>Messages</span></a>
  <a class="brand" href="enter.html" aria-label="WHISPR home"><img src="https://i.imgur.com/7vlpCCX.png" alt="WHISPR logo"><span>WHISPR</span></a>
  <a class="identity" id="profileIdentity" aria-label="Visit profile">
    <span class="profile-avatar"><span id="profileInitial">?</span><img id="profileAvatar" alt="" hidden></span>
    <span class="identity-text"><strong id="chatName">Chat</strong><span id="chatSubtitle">Private conversation</span></span>
  </a>
  <div class="actions" id="chatActions"><button id="callBtn" class="action-btn" type="button" hidden>☎ <span>Voice call</span></button><button id="blockBtn" class="action-btn danger" type="button" hidden>Block</button></div>
</header>
<main class="chat-shell">
  <div class="notice" id="notice" role="status"></div>
  <section class="messages" id="messages" aria-live="polite" aria-label="Conversation messages"><div class="empty-state">Loading messages…</div></section>
  <form class="send-box" id="sendForm" aria-label="Send a message">
    <input type="text" id="msgInput" maxlength="4000" autocomplete="off" placeholder="Write a message…" aria-label="Message" required>
    <button class="send-btn" id="sendBtn" type="submit">Send</button>
  </form>
</main>
<div class="call-overlay" id="callOverlay" hidden>
  <div class="call-card">
    <div class="call-icon">☎</div>
    <h2 id="callTitle">Voice call</h2>
    <p id="callStatus">Connecting…</p>
    <div class="call-controls"><button id="acceptCallBtn" class="send-btn" type="button" hidden>Answer</button><button id="endCallBtn" class="action-btn danger" type="button">End call</button></div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script type="module" src="chat.js"></script>
<script src="theme.js" defer></script>
</body>
</html>
